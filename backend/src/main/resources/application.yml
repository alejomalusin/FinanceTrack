server:
  port: 8080
  error:
    include-message: never
spring:
  config.import: optional:file:./local.properties,optional:file:./backend/local.properties
  application.name: financetrack-api
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=FinanceTrack;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:financetrack_app}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties.hibernate:
      dialect: org.hibernate.dialect.SQLServerDialect
      jdbc.time_zone: UTC
  jackson.default-property-inclusion: non_null
springdoc.swagger-ui.path: /swagger-ui.html
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-random-32-byte-value}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:14}
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
